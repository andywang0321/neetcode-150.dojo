[dojo]
format = 1
engine = ">=0.1,<1"
id = "neetcode-150"
title = "NeetCode 150"
version = "0.1.0"
source = "github.com/lufftw/neetcode (community mirror of LeetCode 150)"
license = "private"
contracts = ["assessment.v1", "review.v1"]

[display]
topic = "Pattern"
item = "Problem"
outline = "Roadmap"
difficulty = ["Easy", "Medium", "Hard"]

[server]
command = ["uv", "run", "--project", ".", "python", "-m", "neetcode_dojo.server"]
transport = "stdio"

[[reflection]]
id = "time_complexity"
prompt = "What is the time complexity of your solution? State the Big-O bound and justify it in one or two sentences."

[[reflection]]
id = "space_complexity"
prompt = "What is the space complexity of your solution? State the Big-O bound and justify it in one or two sentences."

[[evaluator]]
id = "tests"
tool = "assess.tests"
assurance = "machine"
required = true
timeout = 60

[[evaluator]]
id = "oracle"
tool = "assess.oracle"
assurance = "machine"
required = false
timeout = 60

[[evaluator]]
id = "complexity"
tool = "assess.complexity"
assurance = "measured"
required = false
timeout = 300

[[evaluator]]
id = "style"
tool = "assess.style"
assurance = "judged"
required = false
timeout = 60

[[evaluator]]
id = "variant"
tool = "variant"
assurance = "self"
required = false
timeout = 60

[[evaluator]]
id = "grade"
tool = "grade"
assurance = "judged"
required = false
timeout = 60

