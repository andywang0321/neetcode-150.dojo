[project]
name = "neetcode-150.dojo"
version = "0.1.0"
description = "The NeetCode 150 as a dojo curriculum."
readme = "README.md"
authors = [
    { name = "Andy Wang", email = "andywang0321@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "neetcode_dojo"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "ty>=0.0.92",
]

[tool.ruff]
line-length = 100
target-version = "py315"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
